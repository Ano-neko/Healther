# XcodeGen spec — generate the Xcode project on a Mac with:
#   brew install xcodegen && cd App && xcodegen
# Personal signing values live in Config/Local.xcconfig (git-ignored; copy Local.example.xcconfig).
name: Healther
options:
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  HealtherCore:
    path: ..
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  Healther:
    type: application
    platform: iOS
    sources:
      - path: Healther
    dependencies:
      - package: HealtherCore
        product: HealtherCore
      - sdk: HealthKit.framework
    info:
      path: Healther/Info.plist
      properties:
        CFBundleDisplayName: Healther
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: io.github.healther
            CFBundleURLSchemes: [healther]
        NSHealthShareUsageDescription: Healther 读取你的睡眠、活动、心率、HRV、体重等健康数据，让 AI 伙伴了解你的身体状态。数据只保存在本机。
        NSHealthUpdateUsageDescription: Healther 会把你确认的饮食、饮水、体重和情绪记录写入 Apple 健康。
        NSCameraUsageDescription: 拍下你的餐食，让 AI 帮你识别和记录。
        NSPhotoLibraryUsageDescription: 从相册选择餐食照片进行识别。
    entitlements:
      path: Healther/Healther.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(HEALTHER_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(HEALTHER_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
